# Configuración local de Supabase CLI para UsachSchedule.
# Producción se gestiona desde el dashboard; este archivo solo describe el
# entorno de desarrollo y lo que `supabase db reset` debe reproducir.

project_id = "schedule-didactic"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# En local no se exige confirmar el correo para agilizar las pruebas.
# En producción debe quedar activado en el dashboard.
enable_confirmations = false

[auth.rate_limit]
email_sent = 2
